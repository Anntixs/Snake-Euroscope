name: Build EuroScope Snake plugin

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Win32 / x86)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, Win32)
        run: cmake -A Win32 -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Show output
        shell: pwsh
        run: Get-ChildItem -Recurse build -Filter *.dll | Select-Object FullName, Length

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: EuroScopeSnake-dll
          path: build/Release/EuroScopeSnake.dll
          if-no-files-found: error
